[project]
name = "conference-rsom-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.scripts]
rsom-export = "rsom_export:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["rsom_export"]
